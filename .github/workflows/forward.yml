name: forward-log
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node forward_update.mjs
      - run: |
          git config user.name "forward-log"
          git config user.email "forward-log@users.noreply.github.com"
          git add forward_log.json
          git diff --cached --quiet || git commit -m "forward log update"
          git push
