<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Black Wolf Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">BLACK WOLF<b>Δ</b></div>
    <select id="sym" aria-label="Symbol"></select>
    <div id="tfs" role="group" aria-label="Timeframe"></div>
    <select id="ctype" aria-label="Chart type"><option value="candles">Candles</option><option value="footprint">Footprint</option></select>
    <button id="bBm" class="btn">Bookmap</button><button id="bSt" class="btn">Stats</button><button id="bFw" class="btn">Fwd</button><button id="bPlan" class="btn">Plan</button>
    <button id="bInd" class="btn">Indicators</button>
    <button id="bRep" class="btn">Replay</button>
    <button id="bWs" class="btn">Workspace</button>
    <button id="bTz" class="btn" title="Time zone">Local</button>
    <button id="bTheme" class="btn" title="Theme">◐</button>
    <button id="bHelp" class="btn" title="Guide">؟</button><button id="bSet" class="btn" title="Settings">⚙</button><button id="bSide" class="btn only-m">Panel</button>
    <div id="feed" class="feed"><i></i><span>connecting</span></div>
  </header>
  <div id="chip" class="flat"></div>
  <div id="main">
    <aside id="tools"></aside>
    <section id="chartwrap">
      <canvas id="cv"></canvas>
      <div id="legend"></div><div id="drawBar" hidden></div>
      <div id="replaybar" hidden>
        <button class="btn" id="rpPlay">Play</button><button class="btn" id="rpStep">Step ▶</button>
        <select id="rpSpeed"><option value="900">Slow</option><option value="400" selected>Normal</option><option value="120">Fast</option></select>
        <select id="rpMode" title="Replay step"><option value="0" selected>Step: candle</option><option value="1000">Step: 1 s</option><option value="5000">Step: 5 s</option><option value="15000">Step: 15 s</option></select><button class="btn" id="rpBook" title="Jump to the first moment with a recorded order book">Book</button>
        <input type="range" id="rpSlider" min="0" max="100" value="0"><span id="rpInfo"></span>
        <button class="btn" id="rpExit">Exit replay</button>
      </div>
      <div id="textbox" hidden><input id="textIn" maxlength="60" placeholder="Type text, Enter to place"></div>
    </section>
    <aside id="side">
      <nav id="tabs"><button data-t="tape" class="on">Tape</button><button data-t="dom">DOM</button><button data-t="alerts">Alerts</button><button data-t="stats">Stats</button><button data-t="ai">AI</button><button data-t="bt">Test</button><button data-t="mtf">MTF</button><button data-t="mag">Magnet</button><button data-t="reg">Regime</button><button data-t="wy">Wyckoff</button><button data-t="why">Setup</button><button data-t="liq">Liquidity</button><button data-t="gold">Gold</button><button data-t="diag">Diag</button><button data-t="data">Data</button></nav>
      <div id="pane-tape" class="pane"></div><div id="pane-dom" class="pane" hidden></div><div id="pane-alerts" class="pane" hidden></div><div id="pane-stats" class="pane" hidden></div><div id="pane-ai" class="pane" hidden></div><div id="pane-bt" class="pane" hidden></div><div id="pane-mtf" class="pane" hidden></div><div id="pane-mag" class="pane" hidden></div><div id="pane-reg" class="pane" hidden></div><div id="pane-wy" class="pane" hidden></div><div id="pane-why" class="pane" hidden></div><div id="pane-liq" class="pane" hidden></div><div id="pane-gold" class="pane" hidden></div><div id="pane-diag" class="pane" hidden></div><div id="pane-data" class="pane" hidden></div>
    </aside>
  </div>
</div>
<div id="ss" hidden><div class="bmtop"><b id="ssT">Signal stats</b><button class="btn" id="ssX">Back</button><button class="btn" id="ssRef">&#8635;</button></div><div class="bmtop"><label class="chk"><input type="checkbox" id="ssHtf"> <span id="ssHtfL">HTF trend</span></label><select id="ssSess"><option value="all">All sessions</option><option value="london">London</option><option value="ny">New York</option><option value="lny">London + NY</option></select></div><div id="ssBody"></div></div>
<div id="fw" hidden><div class="bmtop"><b id="fwT">Forward test S4 PAXG</b><button class="btn" id="fwX">Back</button><button class="btn" id="fwRef">&#8635;</button></div><div id="fwBody"></div></div>
<div id="bm" hidden><div class="bmtop"><select id="bmSym"></select><select id="bmSrc"><option value="bn">Binance</option><option value="okx">OKX</option></select><button class="btn" id="bmX">Back</button></div><div class="bmtop"><span class="bmgrp"><button class="btn" data-tf="1000">1s</button><button class="btn" data-tf="5000">5s</button><button class="btn" data-tf="60000">1m</button></span><span class="bmgrp"><button class="btn" id="bmZm">&minus;</button><button class="btn" id="bmZp">+</button><button class="btn" id="bmHome">&#8635; live</button></span></div><div class="bmtop"><span class="bmgrp"><button class="btn" data-rp="0.001">&plusmn;0.1%</button><button class="btn" data-rp="0.0025">&plusmn;0.25%</button><button class="btn" data-rp="0.005">&plusmn;0.5%</button><button class="btn" data-rp="0.01">&plusmn;1%</button></span></div><div class="bmtop"><span class="bmgrp"><button class="btn" data-tg="tr">Trades</button><button class="btn" data-tg="ev">Events</button><button class="btn" data-tg="lv">VWAP/POC</button></span></div><div id="bmWrap"><canvas id="bmCv"></canvas></div><div id="bmChips"></div><div id="bmKey"></div><div id="bmLbl"></div><div id="bmRead"></div><div id="bmStat"></div><div id="bmHint" class="bmnote"></div></div>
<div id="sheet" hidden><div class="card"><div class="card-h"><b id="sheetT"></b><button class="btn" id="sheetX">Close</button></div><div id="sheetB"></div></div></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
